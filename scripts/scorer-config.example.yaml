# JobTrail AI scorer — canonical config example
#
# This is the single source of truth for the scorer config example. Copy this
# file to a local, ignored `config.yaml` and edit only the local copy.
#
# The repo-root `config.example.yaml` is now a thin pointer to this file; do
# NOT duplicate these settings elsewhere. A historical duplicate lived under
# the operator runtime root (`<runtime-root>/jobtrail/scorer.config.example.yaml`)
# and contained an embedded private IP — remove it with
# `scripts/_purge_runtime_example.py --yes` once your local runtime has switched
# to the copy in this directory.
#
# All values below are public placeholders. The leak-detector test
# (`tests/test_example_redaction.py`) scans this file for private IPv4 ranges,
# runtime path tokens, and credential prefixes; a regression that re-adds any
# of them fails CI loudly.

jobtrail_base_url: http://localhost:3000
candidate_profile_path: ./candidate-profile.example.md
# Optional private CV; keep this file outside version control. Use an absolute
# path on your local machine, for example `/absolute/path/to/your/candidate-cv.md`.
# candidate_cv_path: ./candidate-cv.md
provider: hermes
marker: "[AI_JOB_SCORE_V1]"
# Prompt context is bounded before it is sent to the provider. These are
# character budgets (not YAML settings); override them per run with:
# PROMPT_PROFILE_BUDGET, PROMPT_CV_BUDGET, and PROMPT_TRUNCATE_MARKER.
# Defaults are 12000, 16000, and "\n[... content truncated ...]".
#
# Every run emits a single `prompt_tokens_estimate={...}` line with a
# per-section breakdown (profile, cv, job, schema, instructions, total)
# using a deterministic estimator (chars/4 by default; override per run with
# PROMPT_TOKEN_ESTIMATOR=chars4|words). Set PROMPT_TOKEN_BUDGET to a positive
# integer to enable a warning when the estimate exceeds the budget; the
# scorer prints `prompt_token_budget={"budget": N, "total": M}` in that case.
