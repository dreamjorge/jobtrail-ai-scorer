[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtrail-ai-scorer"
version = "0.1.0"
description = "Provider-agnostic AI scoring CLI for JobTrail"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
jobtrail-ai-scorer = "jobtrail_ai_scorer.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
