name: Hermes runtime policy guardrail

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily drift check at 06:00 UTC. Catches any out-of-band edits to the
    # fixture files (or a missed local sync of the runtime SOUL/SKILL).
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  runtime-policy:
    name: Assert runtime SOUL/SKILL apply-gate policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run policy guardrail tests
        run: python -m pytest tests/test_runtime_policy.py -v

      - name: Run full test suite (smoke)
        run: python -m pytest -q
